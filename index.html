<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Digital Time Machine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/browser.css">
    <link rel="stylesheet" href="css/effects.css">
</head>
<body>
    <div id="desktop">
        <div id="desktop-icons">
    <div class="icon" data-app="computer">
        <img src="assets/icons/computer.png" alt="">
        <span>My Computer</span>
    </div>
    <div class="icon" data-app="internet">
        <img src="assets/icons/internet.png" alt="">
        <span>Internet</span>
    </div>
    <div class="icon" data-app="aol">
        <img src="assets/icons/mail.png" alt="">
        <span>AOL Mail</span>
    </div>
    <div class="icon" data-app="icq">
        <img src="assets/icons/icq.png" alt="">
        <span>ICQ</span>
    </div>
    <div class="icon" data-app="winamp">
        <img src="assets/icons/winamp.png" alt="">
        <span>Winamp</span>
    </div>
    <div class="icon" data-app="recycle">
        <img src="assets/icons/recycle.png" alt="">
        <span>Recycle Bin</span>
    </div>
</div>
<div id="browser-window">
    <div id="title-bar">
        <div id="title-left">
            <img
                src="assets/browser/netscape-logo.jfif"
                alt=""
                id="browser-logo">
            <span>
                Digital Time Machine - 1998 - Netscape
            </span>
        </div>
        <div id="window-buttons">
            <button>_</button>
            <button>□</button>
            <button>X</button>
        </div>
    </div>
    <div id="toolbar">
        <button>⬅ Back</button>
        <button>➡ Forward</button>
        <button>⟳ Reload</button>
        <button>🏠 Home</button>
    </div>
    <div id="address-bar">
        <span>Location:</span>
        <input
            type="text"
            value="http://www.digitaltimemachine.com/1998/">
    </div>
    <iframe
    id="browser-content"
    src="homepage.html">
</iframe>
    <div id="status-bar">
        Ready
    </div>
</div>
    </div>
    <div id="taskbar">
        <button id="start-btn">
            Start
        </button>
        <div id="task-area">
        </div>
        <div id="clock">
            9:41 PM
        </div>
    </div>
    <div id="dialup">
    <h2>Dialing...</h2>
    <p>Connecting to Digital Time Machine</p>
    <p id="status">Initializing modem...</p>
</div>
<audio
    id="modem"
    src="assets/sounds/dialup.mp3">
</audio>
<script src="js/browser.js"></script>
<script src="js/themeLoader.js"></script>
<script src="js/effects.js"></script>
<script src="js/homepage.js"></script>
<script src="js/timeEngine.js"></script>
<script src="js/windowManager.js"></script>
<script src="js/desktop.js"></script>
<script src="js/navigation.js"></script>
<script src="js/app.js"></script>
</body>
</html>
