<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Time Machine - 1998</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="crt scanlines">
  <div id="desktop">
    <div id="desktop-icons">
      <div class="icon" ondblclick="Desktop.open('Netscape Navigator','websites/1998/geocities.html')">
        <img src="assets/icons/internet.png" alt="Internet">
        <span>Internet</span>
      </div>
      <div class="icon" ondblclick="Desktop.open('ICQ','websites/1998/icq.html')">
        <img src="assets/icons/icq.png" alt="ICQ">
        <span>ICQ</span>
      </div>
      <div class="icon" ondblclick="Desktop.open('AOL Mail','websites/1998/aol.html')">
        <img src="assets/icons/mail.png" alt="AOL Mail">
        <span>AOL Mail</span>
      </div>
      <div class="icon" ondblclick="Desktop.open('My Computer','websites/1998/mycomputer.html')">
        <img src="assets/icons/computer.png" alt="My Computer">
        <span>My Computer</span>
      </div>
      <div class="icon" ondblclick="Desktop.open('Recycle Bin','websites/1998/recyclebin.html')">
        <img src="assets/icons/recycle.png" alt="Recycle Bin">
        <span>Recycle Bin</span>
      </div>
    </div>
    <div id="browser-window">
      <div id="title-bar">
        <div id="title-left">
          <img src="assets/browser/netscape-logo.jfif" alt="" id="browser-logo">
          <span>Digital Time Machine - 1998 - Netscape</span>
        </div>
        <div id="window-buttons">
          <button>_</button>
          <button>&#9633;</button>
          <button>X</button>
        </div>
      </div>
      <div id="toolbar">
        <button id="btn-back">&#11013; Back</button>
        <button id="btn-forward">&#10145; Forward</button>
        <button id="btn-reload">&#8635; Reload</button>
        <button id="btn-home">&#127968; Home</button>
      </div>
      <div id="address-bar">
        <span>Location:</span>
        <input type="text" id="address-input" value="http://www.digitaltimemachine.com/1998/">
      </div>
      <iframe id="browser-content" src="homepage.html"></iframe>
      <div id="status-bar">Ready</div>
    </div>
  </div>
  <div id="taskbar">
    <button id="start-btn">Start</button>
    <div id="task-area"></div>
    <div id="clock">9:41 PM</div>
  </div>
  <div id="dialup">
    <h2>Dialing...</h2>
    <p>Connecting to Digital Time Machine</p>
    <p id="status">Initializing modem...</p>
  </div>
  <audio id="modem" src="assets/sounds/dialup.mp3"></audio>
<script src="index.js"></script>
</body>
</html>
