<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Digital Time Machine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css">
</head>
<body>
    <div id="desktop">
        <div id="desktop-icons">
            <div class="icon">
                🖥️
                <span>My Computer</span>
            </div>
            <div class="icon">
                🌐
                <span>Internet</span>
            </div>
            <div class="icon">
                📁
                <span>Documents</span>
            </div>
            <div class="icon">
                🗑️
                <span>Recycle Bin</span>
            </div>
        </div>
    </div>
    <div id="taskbar">
        <button id="start-btn">
            Start
        </button>
        <div id="task-area">
        </div>
        <div id="clock">
            9:41 PM
        </div>
    </div>
<script src="js/app.js"></script>
</body>
</html>
